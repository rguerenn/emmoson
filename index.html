<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emmoson</title>
<style>
  :root {
    --bg: #000000;
    --blue: #4169E1;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  .logo {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 400;
    letter-spacing: 0.03em;
    color: var(--blue);
    text-shadow: 0 0 40px rgba(65, 105, 225, 0.35);
    user-select: none;
    text-align: center;
    white-space: nowrap;
  }
</style>
</head>
<body>

<div class="logo" id="logo">Emmoson</div>

<script>
  const logo = document.getElementById('logo');
  const TARGET_AREA_RATIO = 0.151;

  function fitLogoToScreenArea() {
    const screenW = window.innerWidth;
    const screenH = window.innerHeight;
    const screenArea = screenW * screenH;
    const targetArea = screenArea * TARGET_AREA_RATIO;

    logo.style.fontSize = '100px';
    const rect = logo.getBoundingClientRect();
    const aspectRatio = rect.width / rect.height;

    let fontSize = Math.sqrt(targetArea / aspectRatio);

    const maxWidth = screenW * 0.82;
    const maxFontSizeForWidth = maxWidth / aspectRatio;
    if (fontSize > maxFontSizeForWidth) {
      fontSize = maxFontSizeForWidth;
    }

    logo.style.fontSize = fontSize + 'px';
  }

  fitLogoToScreenArea();
  window.addEventListener('resize', fitLogoToScreenArea);
</script>

</body>
</html>
